services:
  drill-cloud:
    # BRANCH разделяет контейнеры разных окружений на одном Docker-хосте.
    container_name: "container-drill-cloud-${BRANCH}"
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Moscow}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      INGEST_API_KEY: ${INGEST_API_KEY}
      CURRENT_EVENTS_POLL_MS: ${CURRENT_EVENTS_POLL_MS}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_EDGE_ROLE_PREFIX: ${KEYCLOAK_EDGE_ROLE_PREFIX:-drill-edge-}
      KEYCLOAK_ADMIN_ROLES: ${KEYCLOAK_ADMIN_ROLES:-drill-admin,admin}
    expose:
      - "3101"
    networks:
      - proxy

networks:
  proxy:
    external: true
