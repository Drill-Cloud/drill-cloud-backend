services:
  drill-cloud-v3:
    container_name: drill-cloud-v3
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      INGEST_API_KEY: ${INGEST_API_KEY}
      CURRENT_EVENTS_POLL_MS: ${CURRENT_EVENTS_POLL_MS}
    expose:
      - "3101"
    networks:
      - proxy

networks:
  proxy:
    external: true