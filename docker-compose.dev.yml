services:
  drill-cloud-dev:
    container_name: container-drill-cloud${branch:+-${branch}}
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      INGEST_API_KEY: ${INGEST_API_KEY}
      CURRENT_EVENTS_POLL_MS: ${CURRENT_EVENTS_POLL_MS}
      KEYCLOAK_AUTH_DISABLED: ${KEYCLOAK_AUTH_DISABLED:-false}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_EDGE_ROLE_PREFIX: ${KEYCLOAK_EDGE_ROLE_PREFIX:-drill-edge-}
      KEYCLOAK_ADMIN_ROLES: ${KEYCLOAK_ADMIN_ROLES:-drill-admin,admin}
    expose:
      - "3101"
    networks:
      - proxy

networks:
  proxy:
    external: true
